# Redis 7 configuration for the AJU RAG single-container image.
# Bound to loopback only: Redis is an internal service in this architecture
# and is NOT exposed outside the container (only ports 3000/8000 are published).
# Persistence is enabled (AOF + RDB) so cached/rate-limit state survives restarts.

bind 127.0.0.1 ::1
protected-mode yes
port 6379
daemonize no
supervised no
logfile ""

# Persistence: keep an AOF log plus periodic RDB snapshots under /data/redis,
# which is a Docker volume (see Dockerfile VOLUME + docs/single-container.md).
dir /data/redis
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
save 3600 1 300 100 60 10000
rdbcompression yes
dbfilename dump.rdb

# Internal-only service: no password by default. The application connects over
# loopback inside the container. If you fork this image to expose Redis, set
# `requirepass` explicitly and update REDIS_URL accordingly.
# requirepass change_me_in_production

maxmemory 256mb
maxmemory-policy noeviction
hz 10
