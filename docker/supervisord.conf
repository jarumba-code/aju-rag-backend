; supervisord configuration for the AJU RAG single-container image.
; Process manager (PID 1) for: PostgreSQL, Redis, FastAPI, Next.js.
; Logs go to Docker stdout/stderr via /dev/stdout and /dev/stderr.

[supervisord]
nodaemon = true
pidfile = /tmp/supervisord.pid
logfile = /dev/null
logfile_maxbytes = 0
childlogdir = /tmp

; Local control socket so operators can run `supervisorctl status` inside the
; container. Socket-only (no TCP), no auth needed: the container boundary is
; the access control, same as the postgres/redis loopback bindings.
[unix_http_server]
file = /tmp/supervisor.sock
chmod = 0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///tmp/supervisor.sock

[program:postgres]
priority = 10
directory = /var/lib/postgresql
user = root
command = gosu postgres /usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/data -c listen_addresses=127.0.0.1 -c port=5432
autostart = true
autorestart = true
startsecs = 5
startretries = 5
stopsignal = TERM
stopwaitsecs = 30
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:redis]
priority = 20
directory = /
user = root
command = /usr/bin/redis-server /etc/redis/redis.conf
autostart = true
autorestart = true
startsecs = 5
startretries = 5
stopsignal = TERM
stopwaitsecs = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:backend]
priority = 30
directory = /app/backend
user = root
environment = PYTHONUNBUFFERED="1"
command = /usr/local/bin/run-backend.sh
autostart = true
autorestart = true
startsecs = 10
startretries = 5
stopsignal = TERM
stopwaitsecs = 30
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:frontend]
priority = 40
directory = /app/frontend
user = root
environment = NODE_ENV="production",PORT="3000",HOSTNAME="0.0.0.0"
command = /usr/local/bin/run-frontend.sh
autostart = true
autorestart = true
startsecs = 10
startretries = 5
stopsignal = TERM
stopwaitsecs = 30
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
